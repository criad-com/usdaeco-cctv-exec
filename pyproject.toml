[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usdaeco-cctv-exec"
version = "0.2.4"
description = "Optional OpenExec computations for CCTV drivers"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["testenv"]
python_files = ["test*.py"]
